version: '3.8'

services:
  # FraudGuard Fast Decision Gateway & API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: fraudguard-backend
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=FraudGuard AI
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:///fraudguard.db
      - JWT_SECRET=prod_super_secret_fraudguard_defense_key_2026
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Next.js 14 Fraud Analyst Workbench
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fraudguard-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/api/v1/simulation/ws
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Adversarial Attack & Transaction Stream Simulator
  simulator:
    build:
      context: .
      dockerfile: Dockerfile.simulator
    container_name: fraudguard-simulator
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: fraudguard-network
