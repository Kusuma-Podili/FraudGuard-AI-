name: Docker Multi-Image Build & Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-containers:
    name: Build Multi-Stage Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Backend Gateway Image
        run: |
          docker build -f Dockerfile.backend -t fraudguard-backend:latest .

      - name: Build Simulator Image
        run: |
          docker build -f Dockerfile.simulator -t fraudguard-simulator:latest .

      - name: Build Frontend Next.js Image
        run: |
          docker build -f Dockerfile.frontend -t fraudguard-frontend:latest .
