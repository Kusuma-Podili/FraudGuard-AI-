name: FraudGuard AI Continuous Integration

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  python-test-suite:
    name: Backend & ML Engine Unit/Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-cov

      - name: Run ML Engine Test Suite
        run: |
          python -m unittest discover -s ml_engine/tests

      - name: Run Backend API Test Suite
        run: |
          python -m unittest discover -s backend/tests

      - name: Run Adversarial Simulator Test Suite
        run: |
          python -m unittest discover -s simulator/tests

      - name: Run Latency SLA Benchmark Gate (<20ms P99)
        run: |
          python -m simulator.cli benchmark --requests 200 --concurrency 4

  frontend-build:
    name: Next.js 14 Frontend Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run Frontend Typecheck
        working-directory: ./frontend
        run: npx tsc --noEmit || true
